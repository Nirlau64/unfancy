<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' cdn.jsdelivr.net www.instagram.com connect.facebook.net platform.instagram.com; style-src 'self' fonts.googleapis.com 'unsafe-inline'; font-src fonts.gstatic.com; frame-src www.youtube-nocookie.com www.instagram.com; img-src * data:; connect-src 'self' api.nirlau.de spotify.api.nirlau.de steam.api.nirlau.de api.rss2json.com ddragon.leagueoflegends.com static.developer.riotgames.com cdn.jsdelivr.net;">
    <meta name="theme-color" content="#0b0e0f">
    <meta name="description" content="Steam, Spotify, League of Legends und Socials.">
    <meta property="og:title" content="Unfancy Dashboard">
    <meta property="og:description" content="Steam, Spotify, League of Legends und Socials.">
    <meta property="og:image" content="https://nirlau.de/assets/favicon.png">
    <meta property="og:url" content="https://nirlau.de">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Unfancy Dashboard">
    <meta name="twitter:description" content="Steam, Spotify, League of Legends und Socials.">
    <meta name="twitter:image" content="https://nirlau.de/assets/favicon.png">
    <title>Unfancy - Dashboard</title>
    
    <!-- PWA & iOS Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/assets/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>

    <div class="main-card">
        <header class="site-header">
            <h1>Unfancy</h1>
        </header>

        <!-- Navigation -->
        <nav class="nav-tabs" id="nav-tabs">
            <a href="/" class="nav-link active" data-page="home">Home</a>
            <a href="/?page=steam" class="nav-link" data-page="steam">Steam</a>
            <a href="/?page=spotify" class="nav-link" data-page="spotify">Spotify</a>
            <a href="/?page=lol" class="nav-link" data-page="lol">League of Legends</a>
            <a href="/?page=socials" class="nav-link" data-page="socials">Socials</a>
        </nav>

        <!-- Dieser Container wird ausgetauscht -->
        <main id="app-content">
            <div id="home" class="tab-content active">
                <section class="home-overview" aria-labelledby="home-title">
                    <h2 id="home-title">Bereiche</h2>
                    <div class="explore-grid">
                        <a class="nav-link explore-card" href="/?page=steam" data-page="steam"><span class="explore-title">Steam</span></a>
                        <a class="nav-link explore-card" href="/?page=spotify" data-page="spotify"><span class="explore-title">Spotify</span></a>
                        <a class="nav-link explore-card" href="/?page=lol" data-page="lol"><span class="explore-title">League of Legends</span></a>
                        <a class="nav-link explore-card" href="/?page=socials" data-page="socials"><span class="explore-title">Socials</span></a>
                    </div>
                </section>

                <section class="section home-status" id="live-status-section" style="display: none;" aria-labelledby="live-status-title">
                    <h2 id="live-status-title">Gerade aktiv</h2>
                    <div id="home-spotify-status" aria-live="polite"></div>
                    <div id="home-steam-status" aria-live="polite"></div>
                </section>

                <section class="section home-status" id="recent-status-section" style="display: none;" aria-labelledby="recent-status-title">
                    <h2 id="recent-status-title">Zuletzt gespielt</h2>
                    <div id="home-lol-status" aria-live="polite"></div>
                </section>
            </div>
        </main>

    </div>

    <footer><p><span id="footer-year"></span> Unfancy - Laurin</p></footer>

    <!-- Core App Logic & Router (ES6 Module) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
