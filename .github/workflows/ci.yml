name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node unit tests
        run: node --test tests/*.test.mjs

      - name: Browser smoke tests (real local static server)
        env:
          CHROME_BIN: google-chrome
        run: node --test tests/e2e/browser-smoke.test.mjs
